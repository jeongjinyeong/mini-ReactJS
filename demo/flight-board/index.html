<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="mini-react로 만든 인천공항 스타일의 플립 시계와 가상 국제선 도착 전광판">
  <title>국제선 도착 · Flight Board</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, "Malgun Gothic", sans-serif;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      --sign: #fff1d9;
      --muted: #c2b6a5;
      --line: #3a3732;
      --sign-glow: 0 0 14px #ffd4952e;
      background: #000;
      color: #e9e1d5;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body, h1, p { margin: 0; }
    body { min-height: 100vh; }
    .shell { width: min(100% - 32px, 1660px); margin-inline: auto; padding: 16px 0 20px; }
    .clock-area {
      display: grid;
      justify-items: center;
      gap: 8px;
      width: max-content;
      max-width: 100%;
      margin: 0 auto 16px;
      padding: 10px 13px;
      border: 1px solid var(--sign);
      border-radius: 7px;
      background: #191918;
      box-shadow: 0 4px 14px #18181816;
    }
    .clock-label, .clock-meta, .eyebrow, .flight-head span { font-family: var(--mono); }
    .clock-label { color: #e0d3bf; font-size: .69rem; font-weight: 550; letter-spacing: .22em; }
    .clock-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 14px; font-size: .63rem; }
    .clock-date { color: var(--muted); letter-spacing: .07em; text-transform: uppercase; }
    .clock-hint { color: #e0d3bf; font-size: .69rem; font-weight: 550; white-space: nowrap; }
    .clock { display: flex; align-items: center; gap: clamp(3px, .55vw, 7px); }
    .clock-digit {
      --top: #14191f;
      --bottom: #0c1117;
      --edge: #3a444f;
      --height: clamp(48px, 6.3vw, 78px);
      width: clamp(31px, 4.7vw, 57px);
      font: 700 clamp(34px, 5.2vw, 63px)/1 "Bahnschrift", "Arial Narrow", Arial, sans-serif;
      font-variant-numeric: tabular-nums;
      color: #f9fbfd;
    }
    .clock-colon { display: grid; gap: 10px; padding-inline: 1px; }
    .clock-colon::before, .clock-colon::after {
      content: "";
      width: clamp(3px, .44vw, 6px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #e9deca;
    }

    .board {
      --board-inset: 22px;
      --field-gap: 14px;
      color-scheme: dark;
      overflow: hidden;
      border: 1px solid var(--sign);
      border-radius: 7px;
      background: #191918;
      box-shadow: 0 12px 32px #17171426;
    }
    .board-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 15px var(--board-inset);
      border-bottom: 1px solid var(--line);
      background: #1b1b1a;
    }
    .board-title { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .plane {
      display: grid;
      place-items: center;
      width: 41px;
      aspect-ratio: 1;
      flex: 0 0 auto;
      border: 1px solid #5b5247;
      border-radius: 4px;
      color: var(--sign);
      font: 1.52rem/1 Arial, sans-serif;
    }
    .plane span { transform: rotate(27deg); }
    .eyebrow { margin-top: 5px; color: var(--muted); font-size: .65rem; letter-spacing: .15em; }
    h1 { color: var(--sign); font-size: clamp(1.22rem, 2.8vw, 2.12rem); font-weight: 620; line-height: 1.12; letter-spacing: .01em; text-shadow: var(--sign-glow); }
    .hall { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; }
    .hall-label { display: grid; gap: 2px; color: var(--muted); text-align: right; font-size: .71rem; }
    .hall-label span { font: .63rem var(--mono); letter-spacing: .07em; }
    .hall strong {
      display: grid;
      place-items: center;
      width: 42px;
      aspect-ratio: 1;
      border: 1px solid #5b5247;
      border-radius: 4px;
      color: var(--sign);
      font: 650 1.8rem/1 "Bahnschrift", Arial, sans-serif;
    }

    .table-wrap { --letter-gap: 2px; padding: 0 calc(var(--board-inset) - var(--field-gap)) 10px; overflow-x: auto; background: #1c1c1b; }
    table { width: 100%; min-width: 900px; table-layout: fixed; border-collapse: separate; border-spacing: var(--field-gap) 5px; }
    th, td { padding: 0; }
    .flight-head th {
      padding: 8px 2px 6px;
      text-align: left;
      color: #e5dccf;
      font-size: .79rem;
      font-weight: 650;
    }
    .flight-head span { display: block; margin-top: 2px; color: var(--muted); font-size: .6rem; font-weight: 400; letter-spacing: .09em; }
    .flight-characters { display: flex; }
    .flight-tile {
      --height: clamp(39px, calc((100svh - 412px) / 8), 74px);
      --top: #292927;
      --bottom: #232321;
      --edge: #393936;
      --glyph-size: calc((100cqw - 2px) * .88);
      flex: 1;
      min-width: 0;
      margin-inline-end: var(--letter-gap);
      container-type: inline-size;
      color: #f9fbfd;
      font-weight: 630;
    }
    .flight-number, .board-time, .terminal, .airport-tile {
      --glyph-size: 108cqw;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }
    .flight-number { font-weight: 660; letter-spacing: .025em; }
    [data-column="arrival"] .board-time, .terminal { --glyph-size: 98cqw; font-weight: 540; }
    .status { font-weight: 650; }
    .status-landed { color: #9eeac3; }
    .status-baggage { color: #a8e3ff; }
    .status-delayed { color: #ffdc7c; }
    .status-expected { color: #c3d7ef; }
    .airport-tile { --glyph-size: calc((100cqw - 2px) * .78); color: #b1c9e5; font-weight: 540; }
    tr[data-stage="locked"] .flight-tile[data-value=" "] { --top: #242422; --bottom: #21211f; --edge: #333330; }

    .flip {
      position: relative;
      height: var(--height);
      perspective: 370px;
      border-radius: 4px;
      background: var(--bottom);
      box-shadow: inset 0 0 0 1px var(--edge);
    }
    .flip::after {
      position: absolute;
      z-index: 5;
      inset: 50% 0 auto;
      content: "";
      height: 1px;
      background: #040a13a8;
      pointer-events: none;
    }
    .half {
      position: absolute;
      inset-inline: 1px;
      height: calc(50% - 1px);
      overflow: hidden;
      backface-visibility: hidden;
    }
    .half-top { --fold-angle: -90deg; top: 1px; border-radius: 3px 3px 0 0; background: var(--top); transform-origin: center bottom; }
    .half-bottom { --fold-angle: 90deg; bottom: 1px; border-radius: 0 0 3px 3px; background: var(--bottom); transform-origin: center top; }
    .glyph {
      position: absolute;
      inset-inline: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(var(--height) - 2px);
      white-space: nowrap;
    }
    .glyph-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .flip.flight-tile { border-radius: 3px; }
    .flight-tile::after { content: none; }
    .flight-tile .half-top { border-radius: 2px 2px 0 0; box-shadow: inset 0 -1px #161615; }
    .flight-tile .half-bottom { border-radius: 0 0 2px 2px; }
    .flight-tile .glyph { font-size: min(var(--glyph-size), calc(var(--height) * .68)); }
    .half-top .glyph { top: 0; }
    .half-bottom .glyph { bottom: 0; }
    .old-half { z-index: 2; }
    .flap-out { z-index: 4; animation: fold-a 210ms ease-in both; }
    .flap-in { z-index: 3; animation: unfold-a 260ms 210ms ease-out both; }
    .flip[data-turn="1"] .flap-out { animation-name: fold-b; }
    .flip[data-turn="1"] .flap-in { animation-name: unfold-b; }

    @keyframes fold-a { from { transform: rotateX(0); } to { transform: rotateX(var(--fold-angle)); filter: brightness(.72); } }
    @keyframes fold-b { from { transform: rotateX(0); } to { transform: rotateX(var(--fold-angle)); filter: brightness(.72); } }
    @keyframes unfold-a { from { transform: rotateX(var(--fold-angle)); filter: brightness(.72); } to { transform: rotateX(0); } }
    @keyframes unfold-b { from { transform: rotateX(var(--fold-angle)); filter: brightness(.72); } to { transform: rotateX(0); } }
    .flight-tile { --land-angle: -33deg; }
    .shell[data-direction="up"] .flight-tile { --land-angle: 33deg; }
    tr[data-stage="rolling"] .rest { visibility: hidden; }
    .rolling-window {
      position: absolute;
      inset: 1px;
      overflow: hidden;
      border-radius: 3px;
      perspective: 230px;
    }
    .rolling-card {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(var(--top) 50%, var(--bottom) 50%);
      backface-visibility: hidden;
      animation: roll-card var(--roll-period) linear infinite;
      animation-delay: calc(var(--row-delay) + var(--column-delay));
    }
    .rolling-card-next {
      animation-delay: calc(var(--row-delay) + var(--column-delay) - var(--roll-period) / 2);
    }
    .shell[data-direction="up"] .rolling-card { animation-direction: reverse; }
    @keyframes roll-card {
      0% { transform: translateY(-47%) rotateX(73deg); opacity: .24; }
      25%, 43% { transform: translateY(0) rotateX(0); opacity: 1; }
      79%, 100% { transform: translateY(48%) rotateX(-79deg); opacity: .19; }
    }
    tr[data-stage="locked"][data-changed="true"] .rest {
      animation: land-card 140ms ease-out both;
    }
    @keyframes land-card {
      from { transform: rotateX(var(--land-angle)); opacity: .48; }
      to { transform: rotateX(0); opacity: 1; }
    }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    noscript { display: block; width: fit-content; margin: 12px auto; padding: 8px 12px; background: #191918; color: var(--muted); }

    @media (max-width: 820px) {
      .shell { width: calc(100% - 14px); padding-top: 10px; }
      .clock-area { margin-bottom: 10px; }
      .board { --board-inset: 11px; --field-gap: 7px; }
      .board-head { padding-block: 13px; }
      .board-title { gap: 7px; }
      .plane { width: 31px; font-size: 1.15rem; }
      .eyebrow { font-size: .59rem; letter-spacing: .07em; }
      .hall { gap: 6px; }
      .hall strong { width: 30px; font-size: 1.38rem; }
      .hall-label { font-size: .65rem; }
      .hall-label span, .flight-head span { display: none; }
      .table-wrap { --letter-gap: 1px; padding-bottom: 7px; }
      table { min-width: 690px; border-spacing: var(--field-gap) 3px; }
      .flight-head th { padding: 5px 3px 3px; font-size: .67rem; }
      .flight-tile { --height: 33px; }
    }
  </style>
  <script type="module" src="./demo.js"></script>
</head>
<body>
  <div id="app"></div>
  <noscript>전광판을 보려면 JavaScript를 켜 주세요.</noscript>
</body>
</html>
